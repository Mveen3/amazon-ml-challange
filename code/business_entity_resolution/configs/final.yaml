# FINAL configuration: the settings behind the final submission, runnable end to end from scratch.
#
#   python -m ber.pipeline.run --config configs/final.yaml --stage all                      # train + predict
#   python -m ber.pipeline.run --config configs/final.yaml --set run.inference_only=true --stage all
#                                                           # new test data, trained models from the bundle
#
# Built on the Kaggle profile (fits 2x T4 / 4 CPU / 30 GB RAM; a larger machine works unchanged). Compared with
# configs/kaggle.yaml it adds (improvement.md, all measured or checked on train out-of-fold where labels exist):
#   * r1 trained on 800k entities, r2 on 700k (Track A, 800k/800k: OOF 0.98933 -> 0.98952);
#   * competing-cluster features in round 2 (features/consensus.py: COMP_FEATURES);
#   * list-size counts divided by the country median in round 2 and the gate (France lists are 2x longer);
#   * for profiles without training labels (France): the address admin level learned from the data is ignored in
#     pair features, and r1 list-size counts are put on the train scale (features/admin.py);
#   * the expected-F0.5 set rule is searched next to the grid rule and used only where it wins on OOF;
#   * the stress check is off (its orphan-cluster hypothesis is refuted by the data);
#   * round 2 is bagged: 3 models on different 700k-entity samples, averaged (stage r2bag, Track H);
#   * France keeps its address admin level and raw list sizes in the round-1 features: both adaptations together cost
#     France 0.0009 F0.5 on the leaderboard (Track F 0.985031 vs Track G 0.985166, India/US identical); round 2's
#     consensus still ignores the admin level (as in Track G);
#   * France's set rule is pinned to the one measured on the leaderboard (Track G: France about 0.9606). France has
#     no labels and inherits the US thresholds, whose kappa is flat on OOF and moved 1.0 -> 0.8 -> 1.2 between runs.
inherit: kaggle.yaml

paths:                               # standalone defaults (the Kaggle notebook overrides all three)
  work_dir: work
  data_dir: ../../dataset
  output_dir: ../../output

checkpoint:
  prefix: final                      # Hugging Face folder when checkpointing is on (needs HF_TOKEN; else off)

r1:
  sample_entities: 800000
  max_train_rows: 9000000
  gbdt: {max_entities: 800000}

features:
  density_match: false
  admin_strip: {pairs: false}

r2:                                  # 700k, not 800k: round 2 gained 10 features, and Track A's r2 already peaked at
  sample_entities: 700000            # 30.2 GB of Kaggle's 33.7 GB (measured); this keeps a ~3 GB margin
  max_train_rows: 8000000
  gbdt: {max_entities: 700000}
  bags: 3                            # each bag trains alone, so peak RAM stays that of one 700k model

decision:
  grid:
    kappa: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.2, 1.4, 1.7]   # the US optimum sat on the old upper edge (1.2)
  overrides:
    france: {rule: heuristic, kappa: 1.2, t_min: 0.0, delta: 0.0}

stress:
  enabled: false
