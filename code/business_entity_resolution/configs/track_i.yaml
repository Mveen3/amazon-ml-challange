# Track I (Kaggle, branch kaggle-run): round 3 on top of Track H. Restores the finished runs full + track_a + track_g +
# track_h (read only) and re-does r3 -> gate -> tune -> predict -> outputs -> errors. France keeps its logit shift.
inherit: config.yaml

run:
  extra_stages: [errors]

r3:
  enabled: true

checkpoint:
  enabled: true
  prefix: track_i
  restore_from: [full, track_a, track_g, track_h]
  start_from: r3
  keep_stages: [ce_train, ce_infer]
  restore_ignore: ["*/cands/union/*", "*/vec/*", "*/cands/pre_all.*", "*/cands/pre.parquet", "*/cands/pre_parts/*"]
